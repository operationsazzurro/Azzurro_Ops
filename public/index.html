<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg-0:#060a12;
    --bg-1:#0b1220;
    --panel:rgba(255,255,255,0.04);
    --panel-border:rgba(120,200,255,0.14);
    --panel-border-strong:rgba(120,200,255,0.3);
    --cyan:#5eead4;
    --cyan-bright:#7dfff0;
    --amber:#ffb454;
    --red:#ff6b81;
    --text-hi:#eaf6ff;
    --text-mid:#93a8c3;
    --text-dim:#5b6c85;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%; overflow-x:hidden;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94,234,212,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(120,150,255,0.08), transparent 60%),
      var(--bg-0);
    color:var(--text-hi);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background-attachment:fixed;
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(120,200,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,200,255,0.035) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image: radial-gradient(ellipse 100% 100% at 50% 0%, black 30%, transparent 75%);
  }
  .app{position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:22px 24px 60px;}

  /* Header */
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:14px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg, rgba(94,234,212,0.25), rgba(120,150,255,0.15));
    border:1px solid var(--panel-border-strong);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--cyan-bright);
  }
  .brand h1{font-family:'Space Grotesk',sans-serif; font-size:18px; letter-spacing:0.06em; margin:0; text-transform:uppercase;}
  .brand span{display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-dim); letter-spacing:0.08em; margin-top:2px;}
  .header-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}

  .btn{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:500;
    padding:9px 15px; border-radius:10px; cursor:pointer;
    background:var(--panel); border:1px solid var(--panel-border); color:var(--text-hi);
    transition:all .15s ease; backdrop-filter: blur(10px);
  }
  .btn:hover{border-color:var(--panel-border-strong); background:rgba(255,255,255,0.07);}
  .btn-primary{background:linear-gradient(135deg, rgba(94,234,212,0.22), rgba(94,234,212,0.08)); border-color:rgba(94,234,212,0.4); color:var(--cyan-bright);}
  .btn-primary:hover{background:linear-gradient(135deg, rgba(94,234,212,0.32), rgba(94,234,212,0.14));}
  .btn-danger{border-color:rgba(255,107,129,0.35); color:var(--red);}

  /* Status pill */
  .status-pill{display:flex; align-items:center; gap:7px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); padding:7px 12px; border-radius:20px; background:var(--panel); border:1px solid var(--panel-border);}
  .dot{width:7px;height:7px;border-radius:50%; background:var(--text-dim);}
  .dot.live{background:var(--cyan); box-shadow:0 0 8px var(--cyan);}
  .dot.off{background:var(--red);}

  /* Tabs */
  nav.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; border-bottom:1px solid var(--panel-border); padding-bottom:14px;}
  nav.tabs button{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:500; letter-spacing:0.02em;
    padding:8px 14px; border-radius:9px; border:1px solid transparent; background:transparent; color:var(--text-mid); cursor:pointer;
    transition:all .15s ease;
  }
  nav.tabs button:hover{color:var(--text-hi); background:var(--panel);}
  nav.tabs button.active{color:var(--cyan-bright); background:rgba(94,234,212,0.1); border-color:rgba(94,234,212,0.3);}

  /* Panels */
  .panel{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius);
    backdrop-filter: blur(14px); padding:20px; margin-bottom:18px;
  }
  .panel-title{font-family:'Space Grotesk',sans-serif; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-mid); margin:0 0 14px;}

  /* Dashboard grid */
  .grid-4{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:18px;}
  .stat-card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius); padding:18px;
    backdrop-filter: blur(14px); position:relative; overflow:hidden;
  }
  .stat-card .label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.07em; font-family:'JetBrains Mono',monospace;}
  .stat-card .value{font-family:'Space Grotesk',sans-serif; font-size:32px; font-weight:700; margin-top:6px; color:var(--text-hi);}
  .stat-card.warn .value{color:var(--amber);}
  .stat-card.crit .value{color:var(--red);}
  .stat-card.ok .value{color:var(--cyan-bright);}

  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
  @media (max-width:900px){.two-col{grid-template-columns:1fr;}}

  /* Tables */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); padding:9px 10px; border-bottom:1px solid var(--panel-border); font-weight:500;}
  td{padding:10px; border-bottom:1px solid rgba(255,255,255,0.04); color:var(--text-hi);}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .empty-row td{color:var(--text-dim); text-align:center; padding:24px; font-style:italic;}
  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-family:'JetBrains Mono',monospace;}
  .badge.open{background:rgba(255,107,129,0.15); color:var(--red);}
  .badge.progress{background:rgba(255,180,84,0.15); color:var(--amber);}
  .badge.done{background:rgba(94,234,212,0.15); color:var(--cyan);}
  .badge.active{background:rgba(94,234,212,0.15); color:var(--cyan);}
  .badge.expired{background:rgba(255,107,129,0.15); color:var(--red);}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  input, select, textarea{
    background:rgba(255,255,255,0.03); border:1px solid var(--panel-border); border-radius:8px; color:var(--text-hi);
    padding:9px 11px; font-family:'Inter',sans-serif; font-size:13px; outline:none;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--panel-border-strong);}
  select{ color-scheme: dark; }
  select option{ background-color:#0b1424; color:var(--text-hi); }
  input[type="date"], input[type="month"]{ color-scheme: dark; }
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="month"]::-webkit-calendar-picker-indicator{
    filter: invert(1) brightness(1.3);
    cursor:pointer;
  }
  .search-box{min-width:220px;}

  /* Voice dock */
  .voice-dock{
    position:fixed; bottom:22px; right:22px; z-index:50;
    display:flex; align-items:center; gap:12px;
  }
  .voice-transcript{
    max-width:340px; background:rgba(6,10,18,0.9); border:1px solid var(--panel-border-strong); border-radius:12px;
    padding:12px 14px; font-size:12.5px; color:var(--text-mid); backdrop-filter: blur(16px);
    display:none;
  }
  .voice-transcript.show{display:block;}
  .voice-transcript .answer{color:var(--text-hi); margin-top:6px; line-height:1.5;}
  .mic-btn{
    width:56px; height:56px; border-radius:50%; border:1px solid rgba(94,234,212,0.4);
    background:radial-gradient(circle at 35% 30%, rgba(94,234,212,0.35), rgba(94,234,212,0.08));
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
    box-shadow:0 0 24px rgba(94,234,212,0.15);
  }
  .mic-btn svg{width:22px; height:22px; stroke:var(--cyan-bright); position:relative; z-index:2;}
  .mic-btn.listening{animation:pulse 1.4s ease-in-out infinite;}
  .mic-btn.listening::after{
    content:""; position:absolute; inset:-8px; border-radius:50%; border:1px solid var(--cyan);
    animation:ring 1.4s ease-out infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 24px rgba(94,234,212,0.2);} 50%{box-shadow:0 0 40px rgba(94,234,212,0.5);}}
  @keyframes ring{0%{transform:scale(0.9); opacity:0.9;} 100%{transform:scale(1.6); opacity:0;}}

  /* Modal */
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter: blur(4px); display:none; align-items:center; justify-content:center; z-index:100;}
  .modal-backdrop.show{display:flex;}
  .modal{width:480px; max-width:92vw; max-height:86vh; overflow-y:auto; background:var(--bg-1); border:1px solid var(--panel-border-strong); border-radius:16px; padding:22px;}
  .modal h3{font-family:'Space Grotesk',sans-serif; margin:0 0 16px; font-size:16px; letter-spacing:0.03em;}
  .field{margin-bottom:12px; display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; font-family:'JetBrains Mono',monospace;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:16px;}
  .hint{font-size:11.5px; color:var(--text-dim); margin-top:10px; line-height:1.5;}
  .hint a{color:var(--cyan);}
  .copy-id-btn{ background:transparent; border:none; color:var(--cyan); cursor:pointer; font-size:12px; padding:0 2px; }
  .copy-id-btn:hover{ color:var(--cyan-bright); }

  .role-badge{
    font-family:'JetBrains Mono',monospace; font-size:10px; padding:2px 8px; border-radius:10px; text-transform:uppercase; letter-spacing:0.04em;
  }
  .role-badge.admin{ background:rgba(94,234,212,0.18); color:var(--cyan-bright); }
  .role-badge.editor{ background:rgba(255,180,84,0.18); color:var(--amber); }
  .role-badge.viewer{ background:rgba(255,255,255,0.08); color:var(--text-mid); }
  .role-badge.guest{ background:rgba(255,255,255,0.06); color:var(--text-dim); }
  .icon-btn{
    background:transparent; border:1px solid var(--panel-border); color:var(--text-mid); border-radius:6px;
    width:26px; height:26px; cursor:pointer; font-size:13px; line-height:1; display:inline-flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ color:var(--cyan-bright); border-color:var(--panel-border-strong); }
  .row-actions{ display:flex; gap:6px; white-space:nowrap; }

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(120,200,255,0.2); border-radius:8px;}

  /* ---------- Org chart tree ---------- */
  .org-chart-wrap{overflow-x:auto; overflow-y:hidden; padding:10px 0 30px; cursor:grab; user-select:none;}
  .org-chart-wrap.dragging{ cursor:grabbing; }
  .org-tree, .org-tree ul{
    display:flex; justify-content:center; padding-top:28px; position:relative;
  }
  .org-tree ul{ padding-top:28px; }
  .org-tree li{
    list-style:none; position:relative; padding:28px 12px 0 12px;
    display:flex; flex-direction:column; align-items:center; transition:.2s;
  }
  .org-tree li::before, .org-tree li::after{
    content:''; position:absolute; top:0; right:50%; width:50%; height:28px;
    border-top:1px solid var(--panel-border-strong);
  }
  .org-tree li::after{ right:auto; left:50%; border-left:1px solid var(--panel-border-strong); }
  .org-tree li:only-child{ padding-top:0; }
  .org-tree li:only-child::before, .org-tree li:only-child::after{ display:none; }
  .org-tree li:first-child::before{ border:none; }
  .org-tree li:last-child::after{ border:none; }
  .org-tree li:last-child::before{ border-right:1px solid var(--panel-border-strong); border-radius:0 6px 0 0; }
  .org-tree li:first-child::after{ border-radius:6px 0 0 0; }
  .org-tree > li{ padding-top:0; }
  .org-tree > li::before, .org-tree > li::after{ display:none; }
  .org-tree ul::before{
    content:''; position:absolute; top:0; left:50%; width:0; height:28px;
    border-left:1px solid var(--panel-border-strong);
  }

  .org-node{
    display:inline-flex; flex-direction:column; align-items:center; gap:4px;
    background:var(--panel); border:1px solid var(--panel-border-strong); border-radius:12px;
    padding:10px 14px; min-width:150px; backdrop-filter: blur(12px); cursor:default;
    box-shadow:0 4px 18px rgba(0,0,0,0.25); position:relative;
  }
  .org-node .avatar{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; margin-bottom:2px;
  }
  .org-node .name{ font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:600; color:var(--text-hi); text-align:center; white-space:nowrap; }
  .org-node .desig{ font-size:10.5px; color:var(--text-mid); text-align:center; white-space:nowrap; max-width:190px; overflow:hidden; text-overflow:ellipsis; }
  .org-node .count-badge{
    position:absolute; top:-9px; right:-9px; background:var(--bg-1); border:1px solid var(--panel-border-strong);
    color:var(--cyan); font-family:'JetBrains Mono',monospace; font-size:10px; padding:1px 6px; border-radius:10px;
  }
  .org-node .remove-badge{
    position:absolute; top:-9px; left:-9px; width:19px; height:19px; border-radius:50%;
    background:var(--bg-1); border:1px solid rgba(255,107,129,0.5); color:var(--red);
    font-size:13px; line-height:17px; text-align:center; cursor:pointer; padding:0;
    opacity:0; transition:opacity .15s ease;
  }
  .org-node .edit-badge{
    position:absolute; top:-9px; left:14px; width:19px; height:19px; border-radius:50%;
    background:var(--bg-1); border:1px solid var(--panel-border-strong); color:var(--cyan);
    font-size:11px; line-height:17px; text-align:center; cursor:pointer; padding:0;
    opacity:0; transition:opacity .15s ease;
  }
  .org-node:hover .remove-badge, .org-node:hover .edit-badge{ opacity:1; }
  @media (hover:none){ .org-node .remove-badge, .org-node .edit-badge{ opacity:0.85; } }
  .org-node.lvl-director{ border-color:rgba(94,234,212,0.55); } .org-node.lvl-director .avatar{ background:rgba(94,234,212,0.25); color:var(--cyan-bright); }
  .org-node.lvl-manager{ border-color:rgba(120,200,255,0.4); } .org-node.lvl-manager .avatar{ background:rgba(120,200,255,0.2); color:#a9d4ff; }
  .org-node.lvl-coordinator{ border-color:rgba(255,180,84,0.45); } .org-node.lvl-coordinator .avatar{ background:rgba(255,180,84,0.2); color:var(--amber); }
  .org-node.lvl-executive{ border-color:rgba(180,150,255,0.45); } .org-node.lvl-executive .avatar{ background:rgba(180,150,255,0.22); color:#c9b8ff; }
  .org-node.lvl-supervisor{ border-color:var(--panel-border); } .org-node.lvl-supervisor .avatar{ background:rgba(255,255,255,0.08); color:var(--text-mid); }
  .org-node.dimmed{ opacity:0.25; }
  .org-node.match{ border-color:var(--cyan-bright); box-shadow:0 0 0 2px rgba(94,234,212,0.35), 0 4px 18px rgba(0,0,0,0.25); }

  .org-toggle{
    width:18px; height:18px; border-radius:50%; background:var(--bg-1); border:1px solid var(--panel-border-strong);
    color:var(--cyan); font-size:11px; line-height:16px; text-align:center; cursor:pointer; margin-top:6px; user-select:none;
  }
  .org-tree li.collapsed > ul{ display:none; }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--text-mid); margin-bottom:6px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend .dotc{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  /* ---------- Mobile ---------- */
  @media (max-width: 680px){
    .app{ padding:14px 12px 90px; }
    header{ gap:10px; }
    .brand h1{ font-size:15px; }
    .brand span{ font-size:9px; }
    .brand-mark{ width:32px; height:32px; }
    .header-actions{ width:100%; justify-content:space-between; }
    nav.tabs{ overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; padding-bottom:10px; margin-bottom:14px; }
    nav.tabs button{ flex:0 0 auto; white-space:nowrap; font-size:12px; padding:7px 11px; }
    .panel{ padding:14px; border-radius:12px; }
    .grid-4{ grid-template-columns:repeat(2, 1fr); gap:10px; }
    .stat-card{ padding:13px; }
    .stat-card .value{ font-size:24px; }
    .toolbar{ flex-direction:column; align-items:stretch; }
    .toolbar > div{ display:flex; flex-wrap:wrap; gap:8px; }
    .search-box{ flex:1 1 100%; min-width:0; }
    table{ font-size:12px; }
    th, td{ padding:8px 6px; }
    .modal{ width:94vw; padding:16px; }
    .voice-dock{ bottom:14px; right:14px; }
    .mic-btn{ width:50px; height:50px; }
    .mic-btn svg{ width:19px; height:19px; }
    .voice-transcript{ max-width:calc(100vw - 90px); }
    .org-node{ min-width:120px; padding:8px 10px; }
    .org-node .name{ font-size:11px; }
    .org-node .desig{ font-size:9.5px; max-width:130px; }
    .org-node .remove-badge{ opacity:0.85; }
    .btn{ font-size:12.5px; padding:8px 12px; }
  }
  @media (max-width: 420px){
    .grid-4{ grid-template-columns:1fr; }
    .brand span{ display:none; }
  }
</style>
</head>
<body>
<div class="modal-backdrop" id="loginScreen">
  <div class="modal" style="width:380px;">
    <div class="brand-mark" style="width:44px; height:44px; font-size:15px; margin:0 auto 14px;">OC</div>
    <h1 style="text-align:center; font-family:'Space Grotesk',sans-serif; font-size:17px; letter-spacing:0.05em; margin:0 0 4px;">OPS COMMAND CENTER</h1>
    <p style="text-align:center; color:var(--text-dim); font-size:11px; letter-spacing:0.06em; margin:0 0 24px;">SIGN IN TO CONTINUE</p>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    <div id="loginError" style="color:var(--red); font-size:12px; min-height:16px; margin-bottom:4px;"></div>
    <div class="modal-actions">
      <button class="btn" id="cancelLogin">Cancel</button>
      <button class="btn btn-primary" id="loginBtn">Sign In</button>
    </div>
    <p class="hint" style="text-align:center; margin-top:18px;">No account yet? Ask your admin to create one via the Supabase Dashboard (Authentication → Users).</p>
  </div>
</div>

<div class="app" id="appShell">
  <header>
    <div class="brand">
      <div class="brand-mark">OC</div>
      <div>
        <h1>Ops Command Center</h1>
        <span>SOFT SERVICES · FACILITY MANAGEMENT</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="status-pill"><span class="dot off" id="connDot"></span><span id="connText">Not connected</span></div>
      <div class="status-pill" id="userBadge" style="display:none;"></div>
      <button class="btn btn-primary" id="loginNavBtn" style="display:none;">Sign In</button>
      <button class="btn" id="logoutBtn" style="display:none;">Sign Out</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div id="tabContent"></div>
</div>

<div class="voice-dock" id="voiceDock">
  <div class="voice-transcript" id="voiceBox">
    <div id="voiceHeard"></div>
    <div class="answer" id="voiceAnswer"></div>
  </div>
  <div class="mic-btn" id="micBtn" title="Ask by voice">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </div>
</div>

<div class="modal-backdrop" id="formModal">
  <div class="modal">
    <h3 id="formTitle">Add record</h3>
    <div id="formFields"></div>
    <div class="modal-actions">
      <button class="btn" id="cancelForm">Cancel</button>
      <button class="btn btn-primary" id="saveForm">Save</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="bulkModal">
  <div class="modal">

const RATING_OPTIONS = ['Excellent','Very Good','Good','Fair'];
const RATING_SCORE = { 'Excellent':4, 'Very Good':3, 'Good':2, 'Fair':1 };
function avgRatingLabel(ratings){
  const scored = (ratings||[]).filter(r=>r.rating && RATING_SCORE[r.rating]);
  if(!scored.length) return '—';
  const avg = scored.reduce((s,r)=>s+RATING_SCORE[r.rating],0) / scored.length;
  if(avg >= 3.5) return 'Excellent';
  if(avg >= 2.5) return 'Very Good';
  if(avg >= 1.5) return 'Good';
  return 'Fair';
}

// ---------- org chart (visual tree) ----------
function orgLevelClass(designation){
  const d = (designation||'').toLowerCase();
  if(d.includes('director')) return 'lvl-director';
  if(d.includes('manager')) return 'lvl-manager';
  if(d.includes('coordinator')) return 'lvl-coordinator';
  if(d.includes('executive')) return 'lvl-executive';
  return 'lvl-supervisor';
}
function initials(name){
  return (name||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}
function buildOrgNodeHTML(node){
  const lvl = orgLevelClass(node.designation);
  const hasChildren = node.children && node.children.length>0;
  const writeOk = canWrite();
  const nodeHtml = `
    <div class="org-node ${lvl}" data-id="${node.id}" data-name="${esc((node.full_name||'').toLowerCase())}" data-desig="${esc((node.designation||'').toLowerCase())}">
      ${hasChildren?`<span class="count-badge">${node.children.length}</span>`:''}
      ${writeOk?`<button class="remove-badge" data-remove="${node.id}" title="Remove ${esc(node.full_name)}">×</button>`:''}
      ${writeOk?`<button class="edit-badge" data-edit="${node.id}" title="Edit ${esc(node.full_name)}">✎</button>`:''}
      <div class="avatar">${initials(node.full_name)}</div>
      <div class="name">${esc(node.full_name)}</div>
      <div class="desig" title="${esc(node.designation||'')}">${esc(node.designation||'')}</div>
      ${hasChildren?`<div class="org-toggle" data-toggle="1">−</div>`:''}
    </div>`;
  if(hasChildren){
    const childrenHtml = node.children.map(c=>buildOrgNodeHTML(c)).join('');
    return `<li><div class="node-wrap">${nodeHtml}</div><ul>${childrenHtml}</ul></li>`;
  }
  return `<li><div class="node-wrap">${nodeHtml}</div></li>`;
}

async function renderOrgChart(el){
  const { data, error } = await sb.from('org_hierarchy').select('*').order('full_name');
  if(error) throw error;
  const rows = data || [];
  const writeOk = canWrite();
  if(!rows.length){
    el.innerHTML = `<div class="panel"><div class="panel-title">Org Structure</div>
      <p style="color:var(--text-mid); font-size:13px;">No org records yet.${writeOk?' Run the seed script in Supabase, or use + Add below.':''}</p>
      ${writeOk?'<button class="btn btn-primary" id="addOrgBtn" style="margin-top:10px;">+ Add Person</button>':''}</div>`;
    if(writeOk) document.getElementById('addOrgBtn').onclick = ()=> openOrgForm();
    return;
  }
  const byId = {};
  rows.forEach(r=> byId[r.id] = {...r, children:[]});
  const roots = [];
  rows.forEach(r=>{
    if(r.reports_to && byId[r.reports_to]){ byId[r.reports_to].children.push(byId[r.id]); }
    else roots.push(byId[r.id]);
  });

  const treeHtml = roots.map(r=>buildOrgNodeHTML(r)).join('');
  el.innerHTML = `
    <div class="panel">
      <div class="toolbar">
        <div class="panel-title" style="margin:0;">Org Structure <span style="color:var(--text-dim); font-weight:400;">(${rows.length} people)</span></div>
        <div style="display:flex; gap:8px;">
          <input class="search-box" id="orgSearch" placeholder="Search name or designation...">
          <button class="btn" id="collapseAllBtn">Collapse all</button>
          <button class="btn" id="expandAllBtn">Expand all</button>
          ${writeOk?'<button class="btn btn-primary" id="addOrgBtn">+ Add Person</button>':''}
        </div>
      </div>
      <div class="legend">
        <span><i class="dotc" style="background:var(--cyan-bright)"></i>Director</span>
        <span><i class="dotc" style="background:#a9d4ff"></i>Manager</span>
        <span><i class="dotc" style="background:var(--amber)"></i>Coordinator</span>
        <span><i class="dotc" style="background:#c9b8ff"></i>Executive</span>
        <span><i class="dotc" style="background:var(--text-mid)"></i>Supervisor</span>
      </div>
      <div class="org-chart-wrap">
        <ul class="org-tree">${treeHtml}</ul>
      </div>
    </div>`;

  // toggle collapse/expand per node
  el.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.onclick = (e)=>{
      const li = e.target.closest('li');
      li.classList.toggle('collapsed');
      e.target.textContent = li.classList.contains('collapsed') ? '+' : '−';
    };
  });
  el.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = e.target.dataset.remove;
      const person = byId[id];
      deleteOrgPerson(id, person);
    };
  });
  el.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = e.target.dataset.edit;
      openOrgForm(rows, byId[id]);
    };
  });
  document.getElementById('collapseAllBtn').onclick = ()=>{
    el.querySelectorAll('.org-tree li').forEach(li=>{
      if(li.querySelector(':scope > ul')){ li.classList.add('collapsed'); const t=li.querySelector('[data-toggle]'); if(t) t.textContent='+'; }
    });
  };
  document.getElementById('expandAllBtn').onclick = ()=>{
    el.querySelectorAll('.org-tree li.collapsed').forEach(li=>{
      li.classList.remove('collapsed'); const t=li.querySelector('[data-toggle]'); if(t) t.textContent='−';
    });
  };
  document.getElementById('orgSearch').oninput = (e)=>{
    const q = e.target.value.trim().toLowerCase();
    const nodes = el.querySelectorAll('.org-node');
    if(!q){ nodes.forEach(n=>{ n.classList.remove('match','dimmed'); }); return; }
    nodes.forEach(n=>{
      const isMatch = n.dataset.name.includes(q) || n.dataset.desig.includes(q);
      n.classList.toggle('match', isMatch);
      n.classList.toggle('dimmed', !isMatch);
      if(isMatch){
        // expand ancestors so the match is visible
        let li = n.closest('li');
        while(li){ li.classList.remove('collapsed'); const t = li.querySelector(':scope > .node-wrap [data-toggle]'); if(t) t.textContent='−'; li = li.parentElement ? li.parentElement.closest('li') : null; }
      }
    });
  };
  if(writeOk) document.getElementById('addOrgBtn').onclick = ()=> openOrgForm(rows);
  enableDragToPan(el.querySelector('.org-chart-wrap'));
}

function enableDragToPan(wrap){
  if(!wrap) return;
  let isDown = false, startX = 0, startScroll = 0, moved = false;
  wrap.addEventListener('mousedown', (e)=>{
    // ignore drags starting on interactive elements so clicks/edits still work
    if(e.target.closest('button, input, a, [data-toggle], [data-edit], [data-remove]')) return;
    isDown = true; moved = false;
    startX = e.pageX;
    startScroll = wrap.scrollLeft;
    wrap.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e)=>{
    if(!isDown) return;
    const dx = e.pageX - startX;
    if(Math.abs(dx) > 3) moved = true;
    wrap.scrollLeft = startScroll - dx;
  });
  window.addEventListener('mouseup', ()=>{
    if(!isDown) return;
    isDown = false;
    wrap.classList.remove('dragging');
    if(moved){
      // swallow the click that follows a real drag so it doesn't trigger node toggles
      const suppressClick = (e)=>{ e.stopPropagation(); e.preventDefault(); wrap.removeEventListener('click', suppressClick, true); };
      wrap.addEventListener('click', suppressClick, true);
    }
  });
  wrap.addEventListener('mouseleave', ()=>{
    if(isDown){ isDown = false; wrap.classList.remove('dragging'); }
  });
}

async function deleteOrgPerson(id, person){
  const childCount = person && person.children ? person.children.length : 0;
  const msg = childCount>0
    ? `Remove ${person.full_name}? They have ${childCount} direct report${childCount>1?'s':''} — those people will be moved up to report to ${person.reports_to ? 'their manager' : 'the top of the chart'} instead.`
    : `Remove ${person ? person.full_name : 'this person'} from the org chart? This cannot be undone.`;
  if(!confirm(msg)) return;
  try{
    // Re-point anyone who reported to this person up to this person's own manager
    const { error: reassignErr } = await sb.from('org_hierarchy')
      .update({ reports_to: person ? person.reports_to : null })
      .eq('reports_to', id);
    if(reassignErr) throw reassignErr;
    const { error: delErr } = await sb.from('org_hierarchy').delete().eq('id', id);
    if(delErr) throw delErr;
    renderContent();
  }catch(e){
    alert('Could not remove: ' + (e.message || e));
  }
}

function resetFormModalButtons(){
  const saveBtn = document.getElementById('saveForm');
  const cancelBtn = document.getElementById('cancelForm');
  saveBtn.style.display = '';
  saveBtn.textContent = 'Save';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = ()=> document.getElementById('formModal').classList.remove('show');
}

function openOrgForm(existingRows, editingRow){
  resetFormModalButtons();
  const options = (existingRows||[]).filter(r=> !editingRow || r.id !== editingRow.id)
    .map(r=>`<option value="${r.id}" ${editingRow&&editingRow.reports_to===r.id?'selected':''}>${esc(r.full_name)} — ${esc(r.designation||'')}</option>`).join('');
  document.getElementById('formTitle').textContent = editingRow ? 'Edit Person' : 'Add Person';
  const wrap = document.getElementById('formFields');
  wrap.innerHTML = `
    <div class="field"><label>Full name</label><input data-k="full_name" type="text" value="${editingRow&&editingRow.full_name?esc(editingRow.full_name):''}"></div>
    <div class="field"><label>Designation</label><input data-k="designation" type="text" value="${editingRow&&editingRow.designation?esc(editingRow.designation):''}"></div>
    <div class="field"><label>Department</label><input data-k="department" type="text" value="${editingRow&&editingRow.department?esc(editingRow.department):'Softservice Operations'}"></div>
    <div class="field"><label>Reports to</label><select data-k="reports_to"><option value="">— None (top of chart) —</option>${options}</select></div>
    <div class="field"><label>Email</label><input data-k="email" type="text" value="${editingRow&&editingRow.email?esc(editingRow.email):''}"></div>
    <div class="field"><label>Phone</label><input data-k="phone" type="text" value="${editingRow&&editingRow.phone?esc(editingRow.phone):''}"></div>`;
  document.getElementById('formModal').classList.add('show');
  document.getElementById('saveForm').onclick = async ()=>{
    const values = {};
    wrap.querySelectorAll('[data-k]').forEach(inp=>{ values[inp.dataset.k] = inp.value || null; });
    let result;
    if(editingRow) result = await sb.from('org_hierarchy').update(values).eq('id', editingRow.id);
    else result = await sb.from('org_hierarchy').insert(values);
    if(result.error) alert('Save failed: '+result.error.message); else renderContent();
    document.getElementById('formModal').classList.remove('show');
  };
}

// ---------- generic table renderer ----------
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function esc(s){ return (s===null||s===undefined) ? '' : String(s).replace(/</g,'&lt;'); }

async function renderTable(el, table, title, cols, fields, extraHtmlFn){
  const { data, error } = await sb.from(table).select('*').order('created_at',{ascending:false}).limit(500);
  if(error) throw error;
  const rows = data || [];
  const writeOk = canWrite();
  el.innerHTML = `
    <div class="panel">
      <div class="toolbar">
        <div class="panel-title" style="margin:0;">${title} <span style="color:var(--text-dim); font-weight:400;">(${rows.length})</span></div>
        <div style="display:flex; gap:8px;">
          <input class="search-box" id="tblSearch" placeholder="Search...">
          ${writeOk ? `<button class="btn" id="importBtn">⬆ Import CSV</button><button class="btn btn-primary" id="addBtn">+ Add</button>` : ''}
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table id="tbl"><thead><tr>${cols.map(c=>`<th>${c.replace(/_/g,' ')}</th>`).join('')}${writeOk?'<th></th>':''}</tr></thead>
        <tbody>
        ${rows.length? rows.map((r,i)=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}${writeOk?`<td><button class="icon-btn" data-edit-idx="${i}" title="Edit">✎</button></td>`:''}</tr>`).join('')
          : `<tr class="empty-row"><td colspan="${cols.length + (writeOk?1:0)}">No records yet${writeOk?' — click + Add to create the first one.':'.'}</td></tr>`}
        </tbody></table>
      </div>
    </div>`;
  if(writeOk){
    document.getElementById('importBtn').onclick = ()=> openBulkImport(table, fields, title);
    document.getElementById('addBtn').onclick = ()=> openForm(title, fields, async (values)=>{
      const { error } = await sb.from(table).insert(values);
      if(error) alert('Save failed: '+error.message); else renderContent();
    });
    el.querySelectorAll('[data-edit-idx]').forEach(btn=>{
      btn.onclick = ()=>{
        const row = rows[Number(btn.dataset.editIdx)];
        openForm(title, fields, async (values)=>{
          const { error } = await sb.from(table).update(values).eq('id', row.id);
          if(error) alert('Update failed: '+error.message); else renderContent();
        }, row);
      };
    });
  }
  document.getElementById('tblSearch').oninput = (e)=>{
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('#tbl tbody tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  };
}

async function renderContracts(el){
  const { data, error } = await sb.from('contracts').select('*, clients(client_name), projects(project_name)').order('contract_expiry');
  if(error) throw error;
  const rows = data||[];
  const writeOk = canWrite();
  el.innerHTML = `<div class="panel"><div class="toolbar">
    <div class="panel-title" style="margin:0;">Projects & Contracts (${rows.length})</div>
    ${writeOk ? `<div style="display:flex; gap:8px;">
      <button class="btn" id="importBtn">⬆ Import CSV</button>
      <button class="btn btn-primary" id="addBtn">+ Add Contract</button>
    </div>` : ''}</div>
    <div style="overflow-x:auto;"><table><thead><tr><th>Client</th><th>Project(s)</th><th>Ref</th><th>Expiry</th><th>Monthly Value</th><th>Manpower</th><th>Status</th>${writeOk?'<th></th>':''}</tr></thead>
    <tbody>${rows.length? rows.map((r,i)=>{
      const projNames = (r.projects||[]).map(p=>p.project_name);

function openContractForm(clients, editingRow){
  resetFormModalButtons();
  document.getElementById('formTitle').textContent = editingRow ? 'Edit Contract' : 'Add Contract';
  const wrap = document.getElementById('formFields');
  const currentClientId = editingRow ? editingRow.client_id : '';
  const clientOptions = clients.map(c=>`<option value="${c.id}" ${c.id===currentClientId?'selected':''}>${esc(c.client_name)}</option>`).join('');
  wrap.innerHTML = `
    <div class="field"><label>Client</label>
      <select id="cf_client">
        <option value="">— Select existing client —</option>
        ${clientOptions}
        ${!editingRow ? '<option value="__new__">+ Add a new client</option>' : ''}
      </select>
    </div>
    <div id="cf_newClientFields" style="display:none; border-left:2px solid var(--panel-border-strong); padding-left:10px; margin-bottom:10px;">
      <div class="field"><label>New client name</label><input id="cf_newClientName" type="text"></div>
      <div class="field"><label>Industry</label><input id="cf_newClientIndustry" type="text"></div>
      <div class="field"><label>Contact name</label><input id="cf_newClientContact" type="text"></div>
      <div class="field"><label>Contact email</label><input id="cf_newClientEmail" type="text"></div>
      <div class="field"><label>Contact phone</label><input id="cf_newClientPhone" type="text"></div>
    </div>
    <div class="field"><label>Operating entity</label><input id="cf_entity" type="text" value="${editingRow&&editingRow.operating_entity?esc(editingRow.operating_entity):''}"></div>
    <div class="field"><label>Contract ref</label><input id="cf_ref" type="text" value="${editingRow&&editingRow.contract_ref?esc(editingRow.contract_ref):''}"></div>
    <div class="field"><label>Start date</label><input id="cf_start" type="date" value="${editingRow&&editingRow.contract_start?editingRow.contract_start:''}"></div>
    <div class="field"><label>Expiry date</label><input id="cf_expiry" type="date" value="${editingRow&&editingRow.contract_expiry?editingRow.contract_expiry:''}"></div>
    <div class="field"><label>Monthly invoice value (AED)</label><input id="cf_value" type="number" value="${editingRow&&editingRow.monthly_invoice_value!=null?editingRow.monthly_invoice_value:''}"></div>
    <div class="field"><label>Manpower sanctioned</label><input id="cf_manpower" type="number" value="${editingRow&&editingRow.manpower_sanctioned!=null?editingRow.manpower_sanctioned:''}"></div>
    <div class="field"><label>Scope of work</label><textarea id="cf_scope" rows="3">${editingRow&&editingRow.scope_of_work?esc(editingRow.scope_of_work):''}</textarea></div>
    ${!editingRow ? `
    <div class="field"><label>Project name (optional — creates a linked project so you can add its sites next)</label><input id="cf_project" type="text" placeholder="e.g. Al Ain Mall FM Contract"></div>
    <div class="field"><label>Project code (optional)</label><input id="cf_projectcode" type="text" placeholder="e.g. PRJ-AUH-014"></div>
    ` : `<p class="hint">To add or rename projects under this contract, use the Sites tab's project picker, or ask me to add a project management view.</p>`}
  `;
  document.getElementById('cf_client').onchange = (e)=>{
    document.getElementById('cf_newClientFields').style.display = e.target.value==='__new__' ? 'block' : 'none';
  };
  document.getElementById('formModal').classList.add('show');
  document.getElementById('saveForm').onclick = async ()=>{
    let clientId = document.getElementById('cf_client').value;
    if(!clientId){ alert('Please select or add a client.'); return; }
    if(clientId === '__new__'){
      const newClientName = document.getElementById('cf_newClientName').value;
      if(!newClientName){ alert("Please enter the new client's name."); return; }
      const newClient = {
        client_name: newClientName,
        industry: document.getElementById('cf_newClientIndustry').value || null,
        primary_contact_name: document.getElementById('cf_newClientContact').value || null,
        primary_contact_email: document.getElementById('cf_newClientEmail').value || null,
        primary_contact_phone: document.getElementById('cf_newClientPhone').value || null,
      };
      const { data: clientData, error: clientErr } = await sb.from('clients').insert(newClient).select().single();
      if(clientErr){ alert('Could not create client: '+clientErr.message); return; }
      clientId = clientData.id;
    }
    const contract = {
      client_id: clientId,
      operating_entity: document.getElementById('cf_entity').value || null,
      contract_ref: document.getElementById('cf_ref').value || null,
      contract_start: document.getElementById('cf_start').value || null,
      contract_expiry: document.getElementById('cf_expiry').value || null,
      monthly_invoice_value: document.getElementById('cf_value').value ? Number(document.getElementById('cf_value').value) : null,
      manpower_sanctioned: document.getElementById('cf_manpower').value ? Number(document.getElementById('cf_manpower').value) : null,
      scope_of_work: document.getElementById('cf_scope').value || null,
    };

    if(editingRow){
      const { error: updErr } = await sb.from('contracts').update(contract).eq('id', editingRow.id);
      if(updErr){ alert('Update failed: '+updErr.message); return; }
    } else {
      const { data: contractData, error: contractErr } = await sb.from('contracts').insert(contract).select().single();
      if(contractErr){ alert('Save failed: '+contractErr.message); return; }
      const projectName = document.getElementById('cf_project').value;
      if(projectName){
        const projectCode = document.getElementById('cf_projectcode').value;
        const { error: projErr } = await sb.from('projects').insert({
          contract_id: contractData.id,
          project_name: projectName,
          project_code: projectCode || null
        });
        if(projErr) alert('Contract saved, but the project could not be created: '+projErr.message);
      }
    }
    document.getElementById('formModal').classList.remove('show');
    renderContent();
  };
}

function openFeedbackForm(sites, editingRow){
  resetFormModalButtons();
  document.getElementById('formTitle').textContent = editingRow ? 'Edit Feedback' : 'Add Feedback';
  const wrap = document.getElementById('formFields');
  const ratingsByArea = {};
  if(editingRow) (editingRow.customer_feedback_ratings||[]).forEach(r=> ratingsByArea[r.area] = r);
  const siteOptions = sites.map(s=>`<option value="${s.id}" ${editingRow&&editingRow.site_id===s.id?'selected':''}>${esc(s.site_name)}</option>`).join('');
  const periodVal = editingRow&&editingRow.reporting_period ? editingRow.reporting_period.slice(0,7) : '';
  wrap.innerHTML = `
    <div class="field"><label>Site</label><select id="fb_site"><option value="">— Select site —</option>${siteOptions}</select></div>
    <div class="field"><label>Reporting month</label><input id="fb_period" type="month" value="${periodVal}"></div>
    <div class="field"><label>Client name</label><input id="fb_client" type="text" value="${editingRow&&editingRow.client_name?esc(editingRow.client_name):''}"></div>
    <div class="field"><label>Designation</label><input id="fb_designation" type="text" value="${editingRow&&editingRow.designation?esc(editingRow.designation):''}"></div>
    <div class="field"><label>Date received</label><input id="fb_date" type="date" value="${editingRow&&editingRow.feedback_date?editingRow.feedback_date:''}"></div>
    <div style="border-top:1px solid var(--panel-border); margin:14px 0 10px; padding-top:10px;">
      ${FEEDBACK_AREAS.map((area,i)=>{
        const existing = ratingsByArea[area];
        return `<div class="field">
          <label>${esc(area)}</label>
          <select data-area-rating="${i}">
            <option value="">— Rating —</option>
            ${RATING_OPTIONS.map(o=>`<option value="${o}" ${existing&&existing.rating===o?'selected':''}>${o}</option>`).join('')}
          </select>
          <input data-area-remarks="${i}" type="text" placeholder="Remarks (optional)" value="${existing&&existing.remarks?esc(existing.remarks):''}" style="margin-top:4px;">
        </div>`;
      }).join('')}
    </div>
    <div class="field"><label>Areas of Improvement</label><textarea id="fb_improvement" rows="3">${editingRow&&editingRow.areas_of_improvement?esc(editingRow.areas_of_improvement):''}</textarea></div>
  `;
  document.getElementById('formModal').classList.add('show');
  document.getElementById('saveForm').onclick = async ()=>{
    const siteId = document.getElementById('fb_site').value;
    const periodInput = document.getElementById('fb_period').value; // "YYYY-MM"
    if(!siteId){ alert('Please select a site.'); return; }
    if(!periodInput){ alert('Please select the reporting month.'); return; }
    const header = {
      site_id: siteId,
      reporting_period: periodInput + '-01',
      client_name: document.getElementById('fb_client').value || null,
      designation: document.getElementById('fb_designation').value || null,
      feedback_date: document.getElementById('fb_date').value || null,
      areas_of_improvement: document.getElementById('fb_improvement').value || null,
      submitted_via: 'hardcopy',
    };
    let feedbackId;
    if(editingRow){
      const { error: updErr } = await sb.from('customer_feedback').update(header).eq('id', editingRow.id);
      if(updErr){ alert('Save failed: '+updErr.message); return; }
      feedbackId = editingRow.id;
      await sb.from('customer_feedback_ratings').delete().eq('feedback_id', feedbackId);
    } else {
      const { data: inserted, error: insErr } = await sb.from('customer_feedback').insert(header).select().single();
      if(insErr){ alert('Save failed: '+insErr.message); return; }
      feedbackId = inserted.id;
    }
    const ratingRows = FEEDBACK_AREAS.map((area,i)=>{
      const rating = wrap.querySelector(`[data-area-rating="${i}"]`).value;
      const remarks = wrap.querySelector(`[data-area-remarks="${i}"]`).value;
      if(!rating && !remarks) return null;
      return { feedback_id: feedbackId, area, rating: rating || null, remarks: remarks || null };
    }).filter(Boolean);
    if(ratingRows.length){
      const { error: rErr } = await sb.from('customer_feedback_ratings').insert(ratingRows);
      if(rErr) alert('Feedback saved, but ratings failed: '+rErr.message);
    }
    document.getElementById('formModal').classList.remove('show');
    renderContent();
  };
}

function openLinkGenerator(sites){

      <br><br><b>Note:</b> both <code>ops_command_center.html</code> and <code>feedback.html</code> need to be hosted together (e.g. on Netlify) for this link to work when the client clicks it.</p>

    const base = window.location.href.split('?')[0].replace(/[^/]*$/, ''); // same folder, swap filename
    const label = encodeURIComponent(opt.dataset.label || '');
    urlInput.value = `${base}feedback.html?site=${opt.value}&label=${label}`;
  };
  document.getElementById('saveForm').textContent = 'Copy Link';
  document.getElementById('saveForm').onclick = ()=>{
    const urlInput = document.getElementById('lg_url');
    if(!urlInput.value){ document.getElementById('lg_copyResult').textContent = 'Select a site first.'; return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(urlInput.value).then(()=>{
        document.getElementById('lg_copyResult').textContent = 'Copied to clipboard.';
        document.getElementById('lg_copyResult').style.color = 'var(--cyan-bright)';
      }).catch(()=>{ document.getElementById('lg_copyResult').textContent = 'Could not copy — select and copy manually.'; });
    }
  };
  // restore default Save button behavior when this modal closes via Cancel
  document.getElementById('cancelForm').onclick = ()=>{
    document.getElementById('formModal').classList.remove('show');
    document.getElementById('saveForm').textContent = 'Save';
  };
}

function openBulkImport(table, fields, title, reference){

  document.getElementById('bulkHint').textContent = 'CSV header row must use these exact column names: ' + fields.map(f=>f.k).join(', ') + '. Extra columns are ignored.';
  document.getElementById('bulkReference').innerHTML = buildReferenceHTML(reference);
  document.getElementById('bulkReference').querySelectorAll('[data-copy]').forEach(btn=>{
    btn.onclick = ()=>{
      const val = btn.dataset.copy;
      if(navigator.clipboard && navigator.clipboard.writeText){

        }).catch(()=>{});
      }
    };
  });
  document.getElementById('bulkFile').value = '';
  document.getElementById('bulkPaste').value = '';
  document.getElementById('bulkResult').textContent = '';
  document.getElementById('bulkModal').classList.add('show');
}

// ---------- generic add-record modal ----------
function openForm(title, fields, onSave, existingValues){
  resetFormModalButtons();
  document.getElementById('formTitle').textContent = (existingValues ? 'Edit ' : 'Add ') + title;
  const wrap = document.getElementById('formFields');
  wrap.innerHTML = fields.map(f=>{
    const val = existingValues ? existingValues[f.k] : undefined;
    if(f.type==='textarea') return `<div class="field"><label>${f.l}</label><textarea data-k="${f.k}" rows="3">${val!=null?esc(val):''}</textarea></div>`;
    if(f.type==='checkbox'){
      const boolVal = val===true || val==='true';
      return `<div class="field"><label>${f.l}</label><select data-k="${f.k}"><option value="false" ${!boolVal?'selected':''}>No</option><option value="true" ${boolVal?'selected':''}>Yes</option></select></div>`;
    }
    if(f.type==='select') return `<div class="field"><label>${f.l}</label><select data-k="${f.k}">${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
    return `<div class="field"><label>${f.l}</label><input data-k="${f.k}" type="${f.type||'text'}" value="${val!=null?esc(val):''}"></div>`;
  }).join('');
  document.getElementById('formModal').classList.add('show');
  document.getElementById('saveForm').onclick = async ()=>{
    const values = {};
    wrap.querySelectorAll('[data-k]').forEach(inp=>{
      let v = inp.value;
      if(inp.tagName==='SELECT' && (v==='true'||v==='false')) v = (v==='true');
      values[inp.dataset.k] = v;
    });
    await onSave(values);
    document.getElementById('formModal').classList.remove('show');
  };
}
document.getElementById('cancelForm').onclick = ()=> document.getElementById('formModal').classList.remove('show');

  const file = e.target.files[0];

  const headers = bulkContext.fields.map(f=>f.k).join(',');
  const blob = new Blob([headers + '\n'], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = bulkContext.table + '_template.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
};

document.getElementById('doBulkImport').onclick = async ()=>{
  if(!bulkContext || !sb) return;
  if(bulkContext.customHandler){ await bulkContext.customHandler(); return; }
  const resultEl = document.getElementById('bulkResult');
  const text = document.getElementById('bulkPaste').value.trim();
  if(!text){ resultEl.textContent = 'Please upload or paste CSV data first.'; resultEl.style.color = 'var(--red)'; return; }
  if(typeof Papa === 'undefined'){ resultEl.textContent = 'CSV parser failed to load — check your internet connection and reload the page.'; resultEl.style.color = 'var(--red)'; return; }

  resultEl.style.color = 'var(--text-mid)';
  resultEl.textContent = 'Parsing…';

  const parsed = Papa.parse(text, { header:true, skipEmptyLines:true, transformHeader: h => h.trim() });
  if(parsed.errors && parsed.errors.length){
    resultEl.textContent = 'CSV parse error: ' + parsed.errors[0].message;
    resultEl.style.color = 'var(--red)';
    return;
  }

  const knownKeys = bulkContext.fields.map(f=>f.k);
  const typeMap = {};
  bulkContext.fields.forEach(f=> typeMap[f.k] = f.type);

  const rows = parsed.data.map(r=>{
    const row = {};
    knownKeys.forEach(k=>{
      const v = r[k];
      if(v === undefined || v === null || v === '') return;
      if(typeMap[k] === 'number'){ const n = Number(v); if(!Number.isNaN(n)) row[k] = n; }
      else if(typeMap[k] === 'checkbox'){ row[k] = ['true','1','yes','y'].includes(String(v).trim().toLowerCase()); }
      else{ row[k] = String(v).trim(); }
    });
    return row;
  }).filter(r => Object.keys(r).length > 0);

  if(!rows.length){
    resultEl.textContent = 'No valid rows found — check that your CSV header row matches the expected column names exactly.';
    resultEl.style.color = 'var(--red)';
    return;
  }

  resultEl.textContent = `Importing ${rows.length} row(s)…`;
  let success = 0, failed = 0, firstError = '';

  if(bulkContext.table === 'contracts'){
    // Contracts need row-by-row handling so each row's project_name/project_code
    // (not real columns on `contracts`) can be used to create a linked project
    // right after that specific contract is inserted.
    for(let i=0; i<rows.length; i++){
      const row = rows[i];
      const { project_name, project_code, ...contractOnly } = row;
      const { data: inserted, error: cErr } = await sb.from('contracts').insert(contractOnly).select('id').single();
      if(cErr){ failed++; if(!firstError) firstError = cErr.message; resultEl.textContent = `Importing… ${i+1} / ${rows.length} processed.`; continue; }
      if(project_name){
        const { error: pErr } = await sb.from('projects').insert({
          contract_id: inserted.id, project_name, project_code: project_code || null
        });
        if(pErr){ if(!firstError) firstError = 'Contract saved but project failed: ' + pErr.message; }
      }
      success++;
      resultEl.textContent = `Importing… ${i+1} / ${rows.length} processed.`;
    }
  } else {
    const batchSize = 300;
    for(let i=0; i<rows.length; i+=batchSize){
      const batch = rows.slice(i, i+batchSize);
      const { error } = await sb.from(bulkContext.table).insert(batch);
      if(error){ failed += batch.length; if(!firstError) firstError = error.message; }
      else success += batch.length;
      resultEl.textContent = `Importing… ${Math.min(i+batchSize, rows.length)} / ${rows.length} processed.`;
    }
  }

  if(failed === 0){
    resultEl.style.color = 'var(--cyan-bright)';
    resultEl.textContent = `Done — ${success} row(s) imported successfully.`;
    setTimeout(()=>{ document.getElementById('bulkModal').classList.remove('show'); renderContent(); }, 1100);
  } else {
    resultEl.style.color = 'var(--red)';
    resultEl.textContent = `${success} row(s) imported, ${failed} failed. First error: ${firstError}`;
  }
};

// ---------- voice ----------
const micBtn = document.getElementById('micBtn');
const voiceBox = document.getElementById('voiceBox');
const voiceHeard = document.getElementById('voiceHeard');
const voiceAnswer = document.getElementById('voiceAnswer');

function speak(text){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

async function answerQuery(q){
  const query = q.toLowerCase();
  if(!sb) return "I'm not connected to your database yet. Please connect Supabase first.";
  if(!currentUser) return "Please sign in first — this app is for internal staff only.";
  try{
    if(query.includes('shortage')){
      const { data, error } = await sb.rpc('get_dashboard_summary');
      if(error) throw error;
      const short = (data && data.shortage_sites) || [];
      if(!short.length) return "No staff shortages right now. All sites are fully staffed.";
      return `${short.length} site${short.length>1?'s have':' has'} a shortage: ` + short.map(s=>`${s.site_name}, short by ${s.shortage}`).join('; ') + '.';
    }
    if(query.includes('complaint')){
      const { data } = await sb.from('client_complaints').select('*, sites(site_name)').neq('status','closed');
      if(!data || !data.length) return "No open complaints. Great news.";
      return `There are ${data.length} open complaint${data.length>1?'s':''}: ` + data.slice(0,5).map(c=>`${c.category||'complaint'} at ${c.sites?.site_name||'a site'}, ${c.severity} severity`).join('; ') + '.';
    }
    if(query.includes('expir')){
      const today = new Date().toISOString().slice(0,10);
      const future = new Date(Date.now()+90*86400000).toISOString().slice(0,10);
      const { data } = await sb.from('contracts').select('*, clients(client_name)').gte('contract_expiry', today).lte('contract_expiry', future);
      if(!data || !data.length) return "No contracts are expiring in the next 90 days.";
      return `${data.length} contract${data.length>1?'s are':' is'} expiring soon: ` + data.map(c=>`${c.clients?.client_name||'a client'} on ${new Date(c.contract_expiry).toLocaleDateString()}`).join('; ') + '.';
    }
    if(query.includes('visit')){
      const today = new Date().toISOString().slice(0,10);
      const { data } = await sb.from('manager_site_visits').select('*, sites(site_name)').eq('scheduled_date', today);
      if(!data || !data.length) return "No manager site visits are scheduled for today.";
      return `Today's visits: ` + data.map(v=>`${v.sites?.site_name||'a site'}, status ${v.status}`).join('; ') + '.';
    }
    if(query.includes('staff') && (query.includes('total') || query.includes('how many'))){
      const { count } = await sb.from('staff').select('*', {count:'exact', head:true}).eq('status','active');
      return `There are currently ${count||0} active staff on record.`;
    }
    return "I can help with staff shortages, open complaints, contracts expiring soon, and today's visit schedule. Try asking one of those.";
  }catch(e){
    return "Something went wrong reaching the database: " + (e.message||e);
  }
}

function initVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    micBtn.title = "Voice recognition isn't supported in this browser — try Chrome desktop.";
    micBtn.style.opacity = 0.4;
    return;
  }
  recognizer = new SR();
  recognizer.lang = 'en-US';
  recognizer.interimResults = false;
  recognizer.maxAlternatives = 1;

  recognizer.onstart = ()=>{ micBtn.classList.add('listening'); voiceBox.classList.add('show'); voiceHeard.textContent='Listening...'; voiceAnswer.textContent=''; };
  recognizer.onend = ()=>{ micBtn.classList.remove('listening'); };
  recognizer.onerror = ()=>{ micBtn.classList.remove('listening'); voiceHeard.textContent='Could not hear that — try again.'; };
  recognizer.onresult = async (event)=>{
    const transcript = event.results[0][0].transcript;
    voiceHeard.textContent = '"' + transcript + '"';
    voiceAnswer.textContent = 'Thinking...';
    const answer = await answerQuery(transcript);
    voiceAnswer.textContent = answer;
    speak(answer);
  };
  micBtn.onclick = ()=>{
    try{ recognizer.start(); }catch(e){ /* already started */ }
  };
}

// ---------- auth ----------
async function loadProfile(){
  const { data } = await sb.auth.getUser();
  currentUser = data ? data.user : null;
  if(!currentUser){ currentRole = null; return; }
  const { data: profile, error } = await sb.from('app_users').select('role, email').eq('id', currentUser.id).single();
  currentRole = (!error && profile) ? profile.role : 'viewer';
}

function updateUserBadge(){
  const badge = document.getElementById('userBadge');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginNavBtn = document.getElementById('loginNavBtn');
  badge.style.display = 'flex';
  if(currentUser){
    badge.innerHTML = `${esc(currentUser.email)} <span class="role-badge ${currentRole}" style="margin-left:6px;">${currentRole}</span>`;
    logoutBtn.style.display = 'inline-flex';
    loginNavBtn.style.display = 'none';
  } else {
    badge.innerHTML = `<span class="role-badge guest">Guest</span>`;
    logoutBtn.style.display = 'none';
    loginNavBtn.style.display = 'inline-flex';
  }
}

async function bootGuest(){
  updateUserBadge();
  currentTab = 'dashboard';
  renderTabs();
  initVoice();
  await checkConnection();
  renderContent();
}

async function bootAfterLogin(){
  await loadProfile();
  document.getElementById('loginScreen').classList.remove('show');
  updateUserBadge();
  renderTabs();
  renderContent();
}

function showLoginScreen(){
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginScreen').classList.add('show');
}

async function attemptLogin(){
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!sb){ errEl.textContent = 'Not connected to the database yet — reload the page.'; return; }
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!email || !password){ errEl.textContent = 'Enter both email and password.'; return; }
  const loginBtn = document.getElementById('loginBtn');
  loginBtn.textContent = 'Signing in…'; loginBtn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  loginBtn.textContent = 'Sign In'; loginBtn.disabled = false;
  if(error){ errEl.textContent = error.message; return; }
  await bootAfterLogin();
}

document.getElementById('loginBtn').onclick = attemptLogin;
document.getElementById('loginPassword').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') attemptLogin(); });
document.getElementById('cancelLogin').onclick = ()=> document.getElementById('loginScreen').classList.remove('show');
document.getElementById('loginNavBtn').onclick = showLoginScreen;
document.getElementById('logoutBtn').onclick = async ()=>{
  if(sb) await sb.auth.signOut();
  currentUser = null; currentRole = null;
  currentTab = 'dashboard';
  updateUserBadge();
  renderTabs();
  renderContent();
};

// ---------- boot ----------
if(createSupabaseClient()){
  bootGuest();
} else {
  document.getElementById('connText').textContent = 'Library failed to load';
}
</script>
