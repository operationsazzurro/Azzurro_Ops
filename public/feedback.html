<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-0:#060a12; --panel:rgba(255,255,255,0.04); --panel-border:rgba(120,200,255,0.14);
    --panel-border-strong:rgba(120,200,255,0.3); --cyan:#5eead4; --cyan-bright:#7dfff0;
    --red:#ff6b81; --text-hi:#eaf6ff; --text-mid:#93a8c3; --text-dim:#5b6c85; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94,234,212,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(120,150,255,0.08), transparent 60%),
      var(--bg-0);
    color:var(--text-hi); font-family:'Inter',sans-serif; min-height:100vh;
  }
  .wrap{ min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; }
  .panel{
    width:640px; max-width:100%; background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius);
    backdrop-filter: blur(14px); padding:26px 24px;
  }
  .brand-mark{
    width:40px;height:40px;border-radius:10px; margin:0 auto 12px;
    background:linear-gradient(135deg, rgba(94,234,212,0.25), rgba(120,150,255,0.15));
    border:1px solid var(--panel-border-strong);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--cyan-bright); font-size:14px;
  }
  .field{margin-bottom:14px; display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; font-family:'JetBrains Mono',monospace;}
  input, textarea{
    background:rgba(255,255,255,0.03); border:1px solid var(--panel-border); border-radius:8px; color:var(--text-hi);
    padding:9px 11px; font-family:'Inter',sans-serif; font-size:13px; outline:none; width:100%;
  }
  input:focus, textarea:focus{border-color:var(--panel-border-strong);}
  .btn-primary{
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:500; padding:11px 15px; border-radius:10px; cursor:pointer;
    background:linear-gradient(135deg, rgba(94,234,212,0.22), rgba(94,234,212,0.08)); border:1px solid rgba(94,234,212,0.4); color:var(--cyan-bright);
    width:100%; margin-top:8px;
  }
  .btn-primary:disabled{ opacity:0.5; cursor:default; }
  .pf-area-row{ padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
  .pf-area-label{ font-size:13px; color:var(--text-hi); margin-bottom:8px; font-weight:500; }
  .pf-rating-options{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .pf-rating-options label{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-mid);
    border:1px solid var(--panel-border); border-radius:8px; padding:6px 11px; cursor:pointer; transition:.15s;
  }
  .pf-rating-options input[type="radio"]{ accent-color: var(--cyan); width:auto; }
  .pf-rating-options label:has(input:checked){ border-color:var(--cyan); color:var(--cyan-bright); background:rgba(94,234,212,0.08); }
  .thankyou{ text-align:center; padding:30px 10px; }
  .thankyou .big-check{ font-size:40px; color:var(--cyan-bright); margin-bottom:10px; }
  .error{ color:var(--red); font-size:12px; min-height:16px; margin-top:6px; }
  .dup-alert{ display:none; margin:-4px 0 14px; padding:10px 12px; border:1px solid rgba(255,107,129,0.5); background:rgba(255,107,129,0.10); color:var(--red); border-radius:8px; font-size:12.5px; line-height:1.5; }
  .msg{ text-align:center; color:var(--text-mid); font-size:13px; padding:20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div style="text-align:center; margin-bottom:6px;">
      <div class="brand-mark">OC</div>
      <h1 style="font-family:'Space Grotesk',sans-serif; font-size:18px; letter-spacing:0.03em; margin:0;">Customer Satisfaction Feedback</h1>
      <p id="siteLabel" style="color:var(--text-dim); font-size:12.5px; margin-top:6px;"></p>
    </div>
    <div id="formBody"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://rvqhzfxotyiphundbagm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vaB8a7cesGrYR3g2VtZgPw_yNAzJ-rZ';

const FEEDBACK_AREAS = [
  'Overall Satisfaction with our Services',
  'Professionalism of Operatives & Staff',
  'Quality of Services',
  'Timeliness and Reliability',
  'Staff Availability',
  'Service Delivery as per the requirements',
  'Responsiveness of our Area Managers'
];
const RATING_OPTIONS = ['Excellent','Very Good','Good','Fair'];

function esc(s){
  return (s===null||s===undefined) ? '' : String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Only the short-code link format (?c=...) is supported.
const shortCode = new URLSearchParams(window.location.search).get('c');
const body = document.getElementById('formBody');

function showMessage(text){
  document.getElementById('siteLabel').textContent = '';
  body.innerHTML = `<p class="msg">${esc(text)}</p>`;
}

async function resolveAndRender(){
  if(!shortCode){
    showMessage('This feedback link is missing some information. Please use the link exactly as it was sent to you, or contact us for a new one.');
    return;
  }
  if(!window.supabase){
    showMessage('Could not connect. Please reload the page and try again.');
    return;
  }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false } });

  // Anonymous visitors can only resolve a code through this function;
  // they have no direct access to the feedback_links table.
  const { data: rows, error } = await sb.rpc('get_feedback_link', { p_code: shortCode });
  const link = Array.isArray(rows) ? rows[0] : null;
  if(error || !link){
    showMessage('This feedback link is invalid or has expired. Please contact us for a new one.');
    return;
  }
  renderForm(sb, link.label);
}

function renderForm(sb, siteLabel){
  document.getElementById('siteLabel').textContent = siteLabel ? `For: ${siteLabel}` : '';

  body.innerHTML = `
    <p style="font-size:13px; color:var(--text-mid); line-height:1.6; margin-bottom:18px;">
      Dear Valued Client, we're constantly striving to improve our services. Please share your experience with us over the last month.
    </p>
    <div class="field"><label>Client Name</label><input id="pf_client" type="text" maxlength="200"></div>
    <div class="field"><label>Designation</label><input id="pf_designation" type="text" maxlength="200"></div>
    <div class="field"><label>Reporting Month</label><input id="pf_period" type="month" min="2000-01" max="2099-12" value="${new Date().toISOString().slice(0,7)}"></div>
    <div id="pf_dupAlert" class="dup-alert" role="alert"></div>
    <div style="margin-top:10px;">
      ${FEEDBACK_AREAS.map((area,i)=>`
        <div class="pf-area-row">
          <div class="pf-area-label">${esc(area)}</div>
          <div class="pf-rating-options">
            ${RATING_OPTIONS.map(o=>`<label><input type="radio" name="pf_rating_${i}" value="${o}"> ${o}</label>`).join('')}
          </div>
          <input type="text" id="pf_remarks_${i}" placeholder="Remarks (optional)" maxlength="500">
        </div>
      `).join('')}
    </div>
    <div class="field" style="margin-top:14px;"><label>Areas of Improvement, if any</label><textarea id="pf_improvement" rows="3" maxlength="2000"></textarea></div>
    <div id="pf_error" class="error"></div>
    <button class="btn-primary" id="pf_submit">Submit Feedback</button>
  `;

  // ---- already-submitted check: one feedback per site per month ----
  const dupAlertEl = document.getElementById('pf_dupAlert');
  const submitEl = document.getElementById('pf_submit');
  let dupSeq = 0, alreadyExists = false, submitting = false;
  function showDuplicate(){
    alreadyExists = true;
    dupAlertEl.textContent = 'Feedback for this site has already been submitted for the selected month, so it cannot be submitted again. Please choose a different month, or contact us if you need to make a correction.';
    dupAlertEl.style.display = 'block';
    submitEl.disabled = true;
  }
  async function checkExisting(){
    const my = ++dupSeq;
    const period = document.getElementById('pf_period').value;
    alreadyExists = false;
    dupAlertEl.style.display = 'none';
    if(!submitting) submitEl.disabled = false;
    if(!period) return;
    const { data, error } = await sb.rpc('feedback_exists', { p_code: shortCode, p_period: period + '-01' });
    if(my !== dupSeq) return; // a newer check superseded this one
    // If the check itself fails, stay open: the server re-checks on submit anyway.
    if(!error && data === true) showDuplicate();
  }
  document.getElementById('pf_period').addEventListener('change', checkExisting);
  document.getElementById('pf_period').addEventListener('input', checkExisting);
  checkExisting();

  document.getElementById('pf_submit').onclick = async ()=>{
    const errEl = document.getElementById('pf_error');
    errEl.textContent = '';
    if(alreadyExists){ return; }
    const period = document.getElementById('pf_period').value;
    if(!period){ errEl.textContent = 'Please select the reporting month.'; return; }
    const ratings = FEEDBACK_AREAS.map((area,i)=>{
      const checked = body.querySelector(`input[name="pf_rating_${i}"]:checked`);
      const remarks = document.getElementById(`pf_remarks_${i}`).value;
      return { area, rating: checked ? checked.value : null, remarks: remarks || null };
    });
    if(ratings.some(r=>!r.rating)){ errEl.textContent = 'Please provide a rating for every area.'; return; }

    const submitBtn = document.getElementById('pf_submit');
    submitting = true; submitBtn.disabled = true; submitBtn.textContent = 'Submitting…';
    try{
      // One server-side call writes the feedback and all ratings together,
      // so a failure can never leave a feedback record without its ratings.
      const { error } = await sb.rpc('submit_feedback', {
        p_code: shortCode,
        p_period: period + '-01',
        p_client: document.getElementById('pf_client').value || null,
        p_designation: document.getElementById('pf_designation').value || null,
        p_improvement: document.getElementById('pf_improvement').value || null,
        p_ratings: ratings
      });
      if(error) throw error;

      body.innerHTML = `<div class="thankyou">
        <div class="big-check">✓</div>
        <h2 style="font-family:'Space Grotesk',sans-serif; font-size:16px; margin:0 0 8px;">Thank you for your feedback!</h2>
        <p style="color:var(--text-mid); font-size:13px;">Your response has been recorded.</p>
      </div>`;
    }catch(e){
      submitting = false;
      submitBtn.disabled = false; submitBtn.textContent = 'Submit Feedback';
      const msg = String(e.message || e);
      if(/duplicate feedback/i.test(msg)){ showDuplicate(); return; }
      errEl.textContent = /invalid link/i.test(msg)
        ? 'This feedback link is no longer valid. Please contact us for a new one.'
        : 'Could not submit: ' + msg;
    }
  };
}

// Keep the month picker to a 4-digit year (2000-2099)
document.addEventListener('input', e=>{
  const el = e.target;
  if(el.tagName !== 'INPUT' || el.type !== 'month' || !el.value) return;
  const y = el.value.split('-')[0];
  if(y.length > 4) el.value = y.slice(0,4) + el.value.slice(y.length);
}, true);
document.addEventListener('focusout', e=>{
  const el = e.target;
  if(el.tagName !== 'INPUT' || el.type !== 'month' || !el.value) return;
  const y = Number(el.value.split('-')[0]);
  if(y < 2000 || y > 2099){
    el.value = '';
    const err = document.getElementById('pf_error');
    if(err) err.textContent = 'Please enter a valid 4-digit year (2000-2099).';
  }
}, true);

resolveAndRender();
</script>
</body>
</html>
